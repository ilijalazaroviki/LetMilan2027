<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даблин до Милано | Одбројување</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            /* Овде стави го името на твојата позадинска слика */
            background-image: url('airplane-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* KLM кралско-син проѕирен слој преку позадината */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 48, 87, 0.85) 0%, rgba(0, 161, 222, 0.72) 100%);
            z-index: 0;
        }

        /* Горно навигациско мени */
        header {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 31, 63, 0.35);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #e0f2fe;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: #38bdf8;
            font-weight: 700;
        }

        /* Главен централен дел */
        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 2px 4px 12px rgba(0, 0, 0, 0.45);
        }

        .route {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 35px;
            color: #e0f2fe;
            text-shadow: 1px 2px 8px rgba(0, 0, 0, 0.4);
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 680px;
            width: 100%;
            margin-bottom: 35px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.12);
            padding: 25px 15px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
        }

        .number {
            display: block;
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #bae6fd;
            font-weight: 600;
        }

        .flight-badge {
            background: rgba(0, 31, 63, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            color: #f0f9ff;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .flight-badge strong {
            color: #38bdf8;
        }

        /* Адаптација за таблети и мобилни телефони */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
            }

            nav {
                gap: 15px;
                justify-content: center;
            }

            h1 {
                font-size: 1.8rem;
            }

            .route {
                font-size: 1.15rem;
                margin-bottom: 25px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                max-width: 360px;
            }

            .time-box {
                padding: 18px 10px;
            }

            .number {
                font-size: 2.3rem;
            }

            .flight-badge {
                font-size: 0.85rem;
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="https://ilijalazaroviki.github.io/" class="logo">✈️ Мои Летови</a>
        <nav>
            <a href="https://ilijalazaroviki.github.io/">Почетна</a>
            <a href="#" class="active">Милано</a>
            <a href="https://ilijalazaroviki.github.io/Letberlin2027/">Берлин</a>
            <a href="https://ilijalazaroviki.github.io/Let_amsterdam/">Амстердам</a>
        </nav>
    </header>

    <main>
        <h1>Подгответе се за полетување!</h1>
        <div class="route">🛫 Италија✈️ 🇮🇹 Милано (LIN)</div>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Денови</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Часови</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Минути</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Секунди</span>
            </div>
        </div>

        <div class="flight-badge">
            Време на лет: <strong>30 Јануари 2027 во 05:45</strong> • Летот е опериран од <strong>KLM</strong>
        </div>
    </main>

    <script>
        const flightDate = new Date("January 30, 2027 05:45:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = flightDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<h2>Летот е започнат или завршен!</h2>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
